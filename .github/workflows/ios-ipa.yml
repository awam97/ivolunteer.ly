name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "codex/**"

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Flutter platform folders exist
        run: flutter create --platforms=ios .

      - name: Fetch packages
        run: flutter pub get

      - name: Build unsigned IPA
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            API_BASE_URL="http://10.0.2.2:8080"
          fi
          flutter build ipa --release --no-codesign --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: i-volunteer-ios-sideload-ipa
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
