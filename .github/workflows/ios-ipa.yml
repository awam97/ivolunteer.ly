name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "codex/**"

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Flutter platform folders exist
        run: flutter create --platforms=ios .

      - name: Fetch packages
        run: flutter pub get

      - name: Import signing certificate
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$IOS_P12_BASE64" ] || [ -z "$IOS_P12_PASSWORD" ] || [ -z "$IOS_KEYCHAIN_PASSWORD" ]; then
            echo "Missing iOS signing secrets."
            exit 1
          fi

          echo "$IOS_P12_BASE64" | base64 --decode > ios_distribution.p12
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          security import ios_distribution.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        env:
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          if [ -z "$IOS_MOBILEPROVISION_BASE64" ] || [ -z "$IOS_PROFILE_NAME" ]; then
            echo "Missing iOS provisioning profile secret."
            exit 1
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/i-volunteer.mobileprovision

      - name: Build IPA
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            API_BASE_URL="http://10.0.2.2:8080"
          fi
          if [ -z "$IOS_TEAM_ID" ] || [ -z "$IOS_BUNDLE_ID" ] || [ -z "$IOS_PROFILE_NAME" ]; then
            echo "Missing IOS_TEAM_ID, IOS_BUNDLE_ID, or IOS_PROFILE_NAME secret."
            exit 1
          fi

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${IOS_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          flutter build ipa --release --dart-define=API_BASE_URL="$API_BASE_URL" --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: i-volunteer-ios-ipa
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
