name: iOS Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-smoke-test:
    name: Minimal iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Create minimal Flutter app
        run: flutter create --org com.ivolunteer.smoke --project-name ivolunteer_smoke smoke_ios

      - name: Build unsigned iOS app
        working-directory: smoke_ios
        run: flutter build ios --release --no-codesign

      - name: Package IPA for Sideloadly
        working-directory: smoke_ios
        run: |
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry ivolunteer-ios-smoke-test.ipa Payload

      - name: Upload smoke-test IPA
        uses: actions/upload-artifact@v5
        with:
          name: ivolunteer-ios-smoke-test
          path: smoke_ios/build/ios/ipa/ivolunteer-ios-smoke-test.ipa
          if-no-files-found: error
