name: Mobile Build

on:
  push:
    branches:
      - main
      - release/**
    tags:
      - v*
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API base URL for the build
        required: false
        default: https://portal.i-volunteer.ly

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      API_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.api_base_url || vars.API_BASE_URL || 'https://portal.i-volunteer.ly' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: i-volunteer-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS IPA
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    env:
      API_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.api_base_url || vars.API_BASE_URL || 'https://portal.i-volunteer.ly' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: Build unsigned iOS app bundle
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Package IPA for Sideloadly
        run: |
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry i-volunteer-ios-sideload.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: i-volunteer-ios-sideload-ipa
          path: mobile/build/ios/ipa/i-volunteer-ios-sideload.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - android
      - ios
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: i-volunteer-android-apk
          path: release-assets/android

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: i-volunteer-ios-sideload-ipa
          path: release-assets/ios

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/android/app-release.apk
            release-assets/ios/i-volunteer-ios-sideload.ipa
