name: i_volunteer_mobile
description: Flutter mobile client for the I Volunteer platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.2.2
  html: ^0.15.5
  http: ^1.2.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  mobile_scanner: ^7.4.0
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
